spring:
  application:
    name: erp-lite-api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

server:
  servlet:
    context-path: /api
  port: 8080

logging:
  level:
    root: INFO
    com.erp: DEBUG
