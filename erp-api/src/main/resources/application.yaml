spring:
  application:
    name: erp-lite-api
  config:
    import: AWS.yml,customer.yml

  # Configuración por defecto para todos los clientes HTTP autoconfigurados
  # (WebClient, RestClient, RestTemplate). Los HTTP Service clients con nombre
  # (ver customer.yml) pueden sobreescribir estos valores.
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
      redirects: dont-follow

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5433/erp_db
    username: debuggeandoideas
    password: secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        use_sql_comments: ${HIBERNATE_SHOW_COMMENTS:true}

  # MongoDB - Spring Boot 4.x
  # auto-index-creation en false a propósito: los índices de todas las colecciones (incluido
  # el índice de texto de product_documents) ya los crea init-mongo.js a mano. Con esto en true,
  # Spring intenta crear su propio índice de texto (derivado de @TextIndexed) con un nombre
  # distinto al que generó el script, y Mongo rechaza el arranque porque no permite dos índices
  # de texto distintos en la misma colección (IndexOptionsConflict).
  data:
    mongodb:
      auto-index-creation: false

    # Redis
    redis:
      host: localhost
      port: 6379
      password: secret
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mongodb:
    uri: mongodb://debuggeandoideas:secret@localhost:27017/erp_catalog_db?authSource=admin

  # Mail (SMTP Gmail)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true

# Server
server:
  port: 9090
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.erp: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: ${LOG_LEVEL_WEB:DEBUG}
    org.springframework.data: ${LOG_LEVEL_DATA:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_PARAMS:TRACE}
    org.mongodb.driver: ${LOG_LEVEL_MONGO:DEBUG}

---
# Perfil "dev": expone detalles de error solo en desarrollo local, nunca en prod
spring:
  config:
    activate:
      on-profile: dev
  web:
    error:
      include-message: ${ERROR_INCLUDE_MESSAGE:always}
      include-binding-errors: ${ERROR_INCLUDE_BINDING:always}
      include-stacktrace: ${ERROR_INCLUDE_STACKTRACE:always}
